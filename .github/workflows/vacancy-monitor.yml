name: 青の交響曲 空席監視

on:
  schedule:
    # 24時間・5分ごと
    - cron: '*/5 * * * *'
  workflow_dispatch:  # 手動実行も可能

env:
  TZ: Asia/Tokyo

jobs:
  check-vacancy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install requests beautifulsoup4

      - name: 空席チェック実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MONITOR_DATE: ${{ vars.MONITOR_DATE }}
          MONITOR_GRADES: ${{ vars.MONITOR_GRADES }}
        run: python check_and_notify.py
